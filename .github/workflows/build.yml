name: Build and release

# Every push to main builds a signed APK and publishes it as the latest GitHub Release.
# The app checks the latest release and offers the update in-app.
on:
  push:
    branches: [main]
    paths-ignore:
      - "ios/**"
      - "sidestore.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already ship the Android SDK; just accept its licences.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: actions/setup-go@v5
        with:
          go-version-file: tailscale-bridge/go.mod
          cache: false

      # Tailscale (tsnet) built as an Android library for the app's built-in Tailscale.
      - name: Build Tailscale bridge
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if ! ./tailscale-bridge/build-android.sh > go.log 2>&1; then
            tail -n 40 go.log | while IFS= read -r line; do echo "::error::go: $line"; done
            exit 1
          fi
          tail -n 3 go.log
          echo "::notice::Tailscale bridge: $(stat -c %s app/libs/tsbridge.aar) bytes"

      - name: Version
        run: echo "VC=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. Run ./publish-to-github.sh on your Mac to set it."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleRelease --no-daemon \
              -PversionCode=$VC \
              -PupdateRepo=${{ github.repository }} > gradle.log 2>&1; then
            grep -E "^e: |error:|FAILED|What went wrong" -A2 gradle.log | head -n 45 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 30 gradle.log
            exit 1
          fi
          tail -n 5 gradle.log
          cp app/build/outputs/apk/release/app-release.apk "WavRemote-1.3.$VC.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VC }}
          name: WavRemote 1.3.${{ env.VC }}
          body: ${{ github.event.head_commit.message || 'Manual build' }}
          files: WavRemote-*.apk
          make_latest: true
